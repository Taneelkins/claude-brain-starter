<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>HUD A: Brass Plaque</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
[data-canvas]{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b1020 url("../frame.jpg") center/cover no-repeat}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.plaque{position:absolute;left:48px;top:40px;width:340px;height:104px;background:#15130f;border:2px solid #9e6b29;border-radius:6px;box-shadow:0 0 0 4px rgba(10,9,8,.55),0 10px 30px rgba(0,0,0,.45)}
.label{position:absolute;left:72px;top:58px;width:200px;height:20px;font:600 16px/20px Oswald,sans-serif;letter-spacing:4px;color:#c99a52}
.coins{position:absolute;left:70px;top:78px;width:300px;height:56px;font:900 46px/56px Merriweather,serif;color:#ffd99a;text-shadow:0 2px 0 #3a2a14}
.coin{position:absolute;left:330px;top:66px;width:34px;height:34px;border-radius:50%;background:#e0a03a;border:3px solid #7a4e1c;box-sizing:border-box}
.daily{position:absolute;left:48px;top:160px;width:340px;height:64px;background:#9e6b29;border:2px solid #d6a45a;border-radius:6px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .18s}
.daily:hover{transform:scale(1.04);background:#b07a32}
.daily:active{transform:scale(.96)}
.dailytext{position:absolute;left:48px;top:160px;width:340px;height:64px;font:600 24px/64px Oswald,sans-serif;letter-spacing:5px;text-align:center;color:#1a120a;pointer-events:none}
.status{position:absolute;left:52px;top:238px;width:420px;height:32px;font:700 22px/32px Merriweather,serif;color:#f2c98a;animation:fade 4s ease-in-out infinite}
@keyframes fade{0%,15%{opacity:0;transform:translateY(6px)}25%,75%{opacity:1;transform:none}100%{opacity:0}}
.tick{display:inline-block;animation:tick 4s infinite}
@keyframes tick{0%,20%{transform:none}24%{transform:translateY(-6px) scale(1.08)}30%{transform:none}}
</style></head><body>
<div data-canvas>
  <div class="plaque" data-rbx="Plaque"></div>
  <div class="label" data-rbx="Label">COINS</div>
  <div class="coins tick" data-rbx="Coins">1,240</div>
  <div class="coin" data-rbx="CoinIcon"></div>
  <div class="daily" data-rbx="Daily"></div>
  <div class="dailytext" data-rbx="DailyText">DAILY REWARD</div>
  <div class="status" data-rbx="Status">+100 coins</div>
</div>
<script>(function(){var c=document.querySelector("[data-canvas]");function f(){var s=Math.min(innerWidth/1920,innerHeight/1080);c.style.transform="scale("+s+")";}addEventListener("resize",f);f();})();</script>
<!-- Paste at the end of a 1920x1080 UI mock. Tag elements with data-rbx="Name".
     tools/ui/measure.py reads the JSON this writes and turns it into Roblox numbers. -->
<script>
(function () {
  function measure() {
    var canvas = document.querySelector("[data-canvas]") || document.body;
    var box = canvas.getBoundingClientRect();
    var scale = box.width / 1920 || 1;
    var out = [];
    document.querySelectorAll("[data-rbx]").forEach(function (el) {
      var r = el.getBoundingClientRect();
      var cs = getComputedStyle(el);
      out.push({
        name: el.getAttribute("data-rbx"),
        x: Math.round((r.left - box.left) / scale), y: Math.round((r.top - box.top) / scale),
        w: Math.round(r.width / scale), h: Math.round(r.height / scale),
        text: el.children.length ? null : el.textContent.trim(),
        font: cs.fontFamily.split(",")[0].replace(/["']/g, "").trim(), weight: cs.fontWeight,
        size: Math.round(parseFloat(cs.fontSize)), spacing: cs.letterSpacing,
        color: cs.color, background: cs.backgroundColor, radius: cs.borderTopLeftRadius,
        stroke: cs.borderTopWidth !== "0px" ? cs.borderTopWidth + " " + cs.borderTopColor : null,
        opacity: cs.opacity
      });
    });
    var tag = document.getElementById("rbx-rects") || document.body.appendChild(Object.assign(document.createElement("script"), { id: "rbx-rects", type: "application/json" }));
    tag.textContent = JSON.stringify(out);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(measure, 600); });
})();
</script>
</body></html>
