<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>HUD B: Paper Tag</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
[data-canvas]{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b1020 url("../frame.jpg") center/cover no-repeat}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.string{position:absolute;left:146px;top:0;width:2px;height:46px;background:#c8b48a}
.tag{position:absolute;left:60px;top:44px;width:176px;height:150px;background:#e9dcbf;border-radius:10px;transform-origin:88px 0;animation:sway 5s ease-in-out infinite;box-shadow:0 8px 20px rgba(0,0,0,.45)}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.hole{position:absolute;left:138px;top:54px;width:18px;height:18px;border-radius:50%;background:#0b1020}
.coins{position:absolute;left:60px;top:84px;width:176px;height:60px;font:700 48px/60px Kalam,cursive;text-align:center;color:#3b2a18}
.label{position:absolute;left:60px;top:142px;width:176px;height:30px;font:400 24px/30px "Patrick Hand",cursive;text-align:center;color:#7a5c38}
.daily{position:absolute;left:262px;top:96px;width:240px;height:60px;background:#e9dcbf;border:3px dashed #7a5c38;border-radius:30px;cursor:pointer;transition:transform .2s}
.daily:hover{transform:rotate(-2deg) scale(1.05)}
.dailytext{position:absolute;left:262px;top:96px;width:240px;height:60px;font:400 28px/60px "Patrick Hand",cursive;text-align:center;color:#3b2a18;pointer-events:none}
.status{position:absolute;left:266px;top:170px;width:360px;height:34px;font:400 26px/34px "Patrick Hand",cursive;color:#e9dcbf}
</style></head><body>
<div data-canvas>
  <div class="string"></div>
  <div class="tag" data-rbx="Tag"></div>
  <div class="hole"></div>
  <div class="coins" data-rbx="Coins">1,240</div>
  <div class="label" data-rbx="Label">coins</div>
  <div class="daily" data-rbx="Daily"></div>
  <div class="dailytext" data-rbx="DailyText">claim daily</div>
  <div class="status" data-rbx="Status">+100 coins!</div>
</div>
<script>(function(){var c=document.querySelector("[data-canvas]");function f(){var s=Math.min(innerWidth/1920,innerHeight/1080);c.style.transform="scale("+s+")";}addEventListener("resize",f);f();})();</script>
<!-- Paste at the end of a 1920x1080 UI mock. Tag elements with data-rbx="Name".
     tools/ui/measure.py reads the JSON this writes and turns it into Roblox numbers. -->
<script>
(function () {
  function measure() {
    var canvas = document.querySelector("[data-canvas]") || document.body;
    var box = canvas.getBoundingClientRect();
    var scale = box.width / 1920 || 1;
    var out = [];
    document.querySelectorAll("[data-rbx]").forEach(function (el) {
      var r = el.getBoundingClientRect();
      var cs = getComputedStyle(el);
      out.push({
        name: el.getAttribute("data-rbx"),
        x: Math.round((r.left - box.left) / scale), y: Math.round((r.top - box.top) / scale),
        w: Math.round(r.width / scale), h: Math.round(r.height / scale),
        text: el.children.length ? null : el.textContent.trim(),
        font: cs.fontFamily.split(",")[0].replace(/["']/g, "").trim(), weight: cs.fontWeight,
        size: Math.round(parseFloat(cs.fontSize)), spacing: cs.letterSpacing,
        color: cs.color, background: cs.backgroundColor, radius: cs.borderTopLeftRadius,
        stroke: cs.borderTopWidth !== "0px" ? cs.borderTopWidth + " " + cs.borderTopColor : null,
        opacity: cs.opacity
      });
    });
    var tag = document.getElementById("rbx-rects") || document.body.appendChild(Object.assign(document.createElement("script"), { id: "rbx-rects", type: "application/json" }));
    tag.textContent = JSON.stringify(out);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(measure, 600); });
})();
</script>
</body></html>
